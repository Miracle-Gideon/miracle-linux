name: Build Miracle Linux APK

# Runs entirely on GitHub's servers — no build step happens on the tablet.
# Push code from Termux, GitHub does the compiling, you download the APK
# from the finished workflow run.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google recently removed the legacy "tools" package from the SDK
          # repository — this action's default (packages: "tools platform-tools")
          # now fails immediately trying to fetch it. Skip that default entirely;
          # we don't need the old "tools" package for a Gradle build anyway.
          packages: ""

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v3
      - run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miracle-linux-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
